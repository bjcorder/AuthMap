version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Chicago
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - rust
    groups:
      compatible-rust:
        update-types: [minor, patch]
        exclude-patterns: ["tree-sitter*", jsonschema, criterion]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: America/Chicago
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - github-actions
    groups:
      codeql:
        patterns: ["github/codeql-action*"]
      compatible-actions:
        update-types: [minor, patch]
        exclude-patterns: ["github/codeql-action*"]
