# cargo-release workspace config.
#
# Dry-run is the default from a release preparation branch rooted at develop:
#
#   cargo release patch
#
# Execute only after reviewing the dry-run and completing the release checklist:
#
#   cargo release patch --execute
#
# See RELEASING.md for the end-to-end runbook.

allow-branch = ["release/*"]

# AuthMap publishes GitHub Release artifacts only. crates.io publishing needs a
# separate reviewed policy because the workspace contains internal crates.
publish = false

# cargo-release prepares the version commit only. The maintainer creates the
# release tag after the release gate validates the promotion merge on main.
push = false
tag = false
consolidate-commits = true

# `tag = false` is documented by cargo-release as the config form of
# `--no-tag`: https://raw.githubusercontent.com/crate-ci/cargo-release/master/docs/reference.md

sign-tag = false
sign-commit = false

tag-name = "v{{version}}"
tag-message = "Release {{tag_name}}"
pre-release-commit-message = "chore: release {{version}}"

pre-release-hook = ["cargo", "test", "--workspace", "--locked"]
